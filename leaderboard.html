<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be!Myn · Live Leaderboard</title>
<style>
@charset "UTF-8";
:root{
  --ink:#482133; --muted:#927581; --pink:#db4f7d; --pink-deep:#bd3d69; --line:#efdce3;
  --serif:Georgia,"Times New Roman",serif;
  font-family:"Trebuchet MS",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#ffe6ef;color:var(--ink);overflow:hidden}
em{font-family:var(--serif);font-weight:normal;font-style:italic;color:var(--pink-deep)}

.bg-blob{position:fixed;border-radius:50%;background:#f9d3e2;z-index:0;filter:blur(2px)}
.bg-blob.one{width:60vw;height:60vw;left:-20vw;bottom:-30vw}
.bg-blob.two{width:40vw;height:40vw;right:-15vw;top:-15vw;opacity:.7}

.stage{
  position:relative;z-index:1;height:100%;
  display:grid;grid-template-columns:1fr minmax(320px,26vw);
  padding:clamp(20px,3vw,56px);
  gap:clamp(16px,2.4vw,40px);
}

.main{display:flex;flex-direction:column;min-height:0}
.header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:clamp(10px,1.6vw,22px)}
.title{font-size:clamp(24px,4vw,64px);font-weight:500;letter-spacing:-1.5px;margin:0;line-height:1.05;overflow-wrap:break-word}
.subtitle{font-size:clamp(11px,1vw,16px);letter-spacing:1.8px;font-weight:bold;color:#9a6b7d;text-transform:uppercase}
.live-dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#3ecf6a;margin-right:8px;box-shadow:0 0 0 0 rgba(62,207,106,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,106,.55)}70%{box-shadow:0 0 0 14px rgba(62,207,106,0)}100%{box-shadow:0 0 0 0 rgba(62,207,106,0)}}

.board{
  flex:1;min-height:0;background:#fffafdF0;border:1px solid #f1d9e3;border-radius:clamp(18px,2vw,28px);
  box-shadow:0 20px 60px #7a2f4d14;overflow:hidden;display:flex;flex-direction:column;
}
.board-head{
  display:flex;align-items:center;gap:clamp(10px,1.4vw,26px);
  padding:clamp(8px,1.1vw,18px) clamp(16px,2vw,34px);
  font-size:clamp(9px,.85vw,13px);letter-spacing:1.6px;color:#a9808f;font-weight:bold;
  border-bottom:1px solid var(--line);
}
.board-head .col-rank{width:clamp(44px,4.4vw,64px);flex:none}
.board-head .col-score{flex:none;text-align:right}

.rows{flex:1;min-height:0;overflow:hidden}
.row{
  display:flex;align-items:center;gap:clamp(10px,1.4vw,26px);
  padding:clamp(8px,1.1vw,18px) clamp(16px,2vw,34px);
  border-bottom:1px solid #f4e4ea;font-size:clamp(15px,1.9vw,28px);
}
.row:last-child{border-bottom:none}
.row.top1{background:linear-gradient(90deg,#fff2f7,transparent)}

.rank-badge{
  flex:none;width:clamp(34px,3.6vw,52px);height:clamp(34px,3.6vw,52px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:bold;font-size:clamp(14px,1.6vw,22px);
  background:#f3dce5;color:#a9677e;border:2px solid #fff;box-shadow:0 2px 6px #7a2f4d1a;
}
.row.rank-1 .rank-badge{background:#f6cf7e;color:#7a4c0e;box-shadow:0 3px 10px #b8860b40}
.row.rank-2 .rank-badge{background:#dfe3ea;color:#4c5566;box-shadow:0 3px 10px #6b768c40}
.row.rank-3 .rank-badge{background:#e3b088;color:#5c3418;box-shadow:0 3px 10px #8b532040}

.player{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1em}
.player .name{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .device-code{font-size:.42em;letter-spacing:.6px;color:#b49aa6;font-weight:normal}

.score{flex:none;text-align:right;font-weight:bold;color:var(--pink-deep);font-variant-numeric:tabular-nums;white-space:nowrap}

.empty-state{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2em;color:#b49aa6;font-size:clamp(14px,1.4vw,22px)}

.updated{margin-top:clamp(8px,1.2vw,16px);font-size:clamp(9px,.8vw,12px);color:#a9808f;text-align:right}

/* Side panel: play prompt + QR */
.side{display:flex;flex-direction:column;gap:clamp(14px,2vw,26px);min-height:0}
.brand-card, .qr-card{
  background:#fffafdF0;border:1px solid #f1d9e3;border-radius:clamp(16px,2vw,26px);
  box-shadow:0 16px 46px #7a2f4d12;padding:clamp(16px,2vw,32px);text-align:center;
}
.brand-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em}
.brand-card img{width:clamp(120px,11vw,190px);height:auto;mix-blend-mode:multiply}
.brand-tag{font-size:clamp(10px,.9vw,14px);color:#9a6b7d}

.qr-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,18px)}
.qr-eyebrow{font-size:clamp(9px,.85vw,13px);letter-spacing:1.8px;font-weight:bold;color:#9a6b7d;text-transform:uppercase}
.qr-title{font-size:clamp(18px,2vw,30px);font-weight:500;margin:0}
.qr-wrap{background:#fff;border-radius:18px;padding:clamp(10px,1.4vw,22px);box-shadow:0 8px 24px #7a2f4d1c}
.qr-wrap img{display:block;width:clamp(140px,14vw,240px);height:auto}
.qr-caption{font-size:clamp(10px,1vw,15px);color:#8b7180;max-width:22em}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .side{flex-direction:row}
  .brand-card,.qr-card{flex:1}
}
@media (max-width:480px){
  html,body{overflow:auto}
  .stage{height:auto;min-height:100%;padding:16px;gap:16px}
  .title{font-size:clamp(22px,7vw,34px)}
  .row{font-size:14px;padding:10px 14px;gap:10px}
  .rank-badge{width:30px;height:30px;font-size:12px}
  .player .device-code{font-size:9px}
  .side{flex-direction:column}
}
</style>
</head>

<script>
(() => {
  // Same public Supabase config as the game — safe to expose (publishable/anon key only).
  const SUPABASE_URL = 'https://nhfyahqlbokltweuidyu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZrgJlDA40pmdholYWMsQkg_sbOAMLYt';
  const REFRESH_MS = 8000;

  async function fetchLeaderboard() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_leaderboard`, {
        method: 'POST',
        credentials: 'omit',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
        body: JSON.stringify({}),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!Array.isArray(rows)) throw new Error('Unexpected response');
      return rows.slice(0, 10)
        .filter(r => typeof r.nickname === 'string' && Number.isFinite(Number(r.score)))
        .map(r => ({
          nickname: r.nickname,
          score: Number(r.score),
          deviceCode: typeof r.device_code === 'string' ? r.device_code : '',
        }));
    } finally {
      clearTimeout(timer);
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function render(rows) {
    const container = document.getElementById('rows');
    if (!rows.length) {
      container.innerHTML = '<div class="empty-state">Be the first to glow! Scan the QR to start playing.</div>';
      return;
    }
    container.innerHTML = rows.map((row, i) => {
      const rank = i + 1;
      const deviceLine = row.deviceCode
        ? `<span class="device-code">ID ${escapeHtml(row.deviceCode)}</span>` : '';
      return `<div class="row${rank <= 3 ? ' rank-' + rank : ''}${rank === 1 ? ' top1' : ''}">
        <span class="rank-badge">${rank}</span>
        <span class="player">
          <span class="name">${escapeHtml(row.nickname)}</span>
          ${deviceLine}
        </span>
        <span class="score">${row.score.toLocaleString()} pts</span>
      </div>`;
    }).join('');
  }

  function setUpdated(ok) {
    const el = document.getElementById('updated');
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    el.textContent = ok ? `Updated ${time}` : `Couldn't refresh at ${time} — retrying…`;
  }

  async function tick() {
    try {
      const rows = await fetchLeaderboard();
      render(rows);
      setUpdated(true);
    } catch {
      setUpdated(false);
      // Keep whatever was last shown rather than blanking the board.
    }
  }

  tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
